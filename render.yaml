databases:
  - name: diu-tracker-db
    databaseName: diu_tracker
    user: diu_admin
    plan: free
    region: oregon

services:
  # FastAPI Backend Web Service
  - type: web
    name: diu-tracker-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/seed_data.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diu-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: '["*"]'

  # React Vite Frontend Static Site
  - type: static
    name: diu-tracker-frontend
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: diu-tracker-backend
          property: host
